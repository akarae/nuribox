version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: nuri-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3307:3306"   # union_system(3306) 과 충돌 방지
    volumes:
      - nuri_mysql_data:/var/lib/mysql
      - ./script.sql:/docker-entrypoint-initdb.d/script.sql   # 최초 기동 시 스키마 자동 반영
    command: --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - TZ=Asia/Seoul
    container_name: nuri-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "4001:4000"   # union_system backend(4000) 과 충돌 방지
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nuri-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "3001:3000"   # union_system frontend(3000) 과 충돌 방지
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: npm start

  nginx:
    image: nginx:stable-alpine
    container_name: nuri-nginx
    restart: unless-stopped
    ports:
      - "8080:80"   # 배포 서버에서는 80으로 매핑
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  nuri_mysql_data:
