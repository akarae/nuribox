services:
  db:
    image: mysql:8.0
    container_name: nuri-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE     : ${DB_NAME}
      MYSQL_USER         : ${DB_USER}
      MYSQL_PASSWORD     : ${DB_PASSWORD}
      TZ                 : Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  backend:
    image: ${DOCKERHUB_USERNAME}/nuri-system-backend:latest
    container_name: nuri-backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      TZ: Asia/Seoul
    depends_on:
      - db
    restart: always

  frontend:
    image: ${DOCKERHUB_USERNAME}/nuri-system-frontend:latest
    container_name: nuri-frontend
    environment:
      TZ: Asia/Seoul
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:latest
    container_name: nuri-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  db_data: